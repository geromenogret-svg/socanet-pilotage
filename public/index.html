<style>
:root{--bg:#f3f7fa;--card:#fff;--ink:#2e3336;--muted:#62707a;--line:#dde6ec;--brand:#1679b8;--brand2:#e3f3fc;--blue:#29abe2;--green:#8dc63f;--ok:#4f8a1c;--okbg:#eef7e1;--warn:#b26a00;--warnbg:#fff2dc;--bad:#c0392b;--badbg:#fde8e6;--info:#1f5fa8;--infobg:#e6eefa;--grey:#7b8a85;--greybg:#eef1f0}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px;color:var(--ink)}
button:hover{border-color:#b9c7c2}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}

button.bad{background:#fff;border-color:var(--bad);color:var(--bad)}

select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
header{background:#fff;color:var(--ink);padding:8px 18px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--green),var(--blue)) 1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted)}
header .logo img{height:56px;display:block}

header .tag{font-size:11px;background:#ffcf5a;color:#3b2a00;padding:2px 8px;border-radius:20px;font-weight:600}
header .sp{flex:1}
header select{background:#fff;color:var(--ink)}
header button{background:#fff;color:var(--brand)}
nav.tabs{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#fff}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:9px 12px;background:none;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--green)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}

.kpi .n{font-size:28px;font-weight:700}

.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}.kpi.ok .n{color:var(--ok)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}

td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow:auto}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.st-prevue{background:var(--greybg);color:var(--grey)}
.st-en_cours{background:var(--infobg);color:var(--info)}
.st-ecart{background:var(--warnbg);color:var(--warn)}

.chip.c-refusee{border-color:var(--bad);background:var(--badbg)}
.chip.c-manquant{border-color:var(--bad);background:#fff;outline:1px dashed var(--bad)}

.bar{height:10px;border-radius:6px;background:var(--greybg);overflow:hidden}

.cgrid th.mth{text-align:left;border-left:2px solid var(--line);text-transform:capitalize;color:var(--ink)}
.cgrid .mon{border-left:2px solid var(--line)}

.cgrid td.num{text-align:right;padding:4px 8px}

.cg-ok{background:var(--okbg);color:var(--ok)}.cg-ecart{background:var(--warnbg);color:var(--warn)}.cg-miss{background:var(--badbg);color:var(--bad)}.cg-prev{background:var(--greybg);color:var(--grey);font-weight:500}.cg-cours{background:var(--infobg);color:var(--info)}.cg-abs{background:#ecebf7;color:#4b47a0;cursor:default;font-size:10.5px}.cg-ponct{box-shadow:inset 0 0 0 1px #7c5cd6}
.cal{table-layout:fixed;font-size:12px}
.cal th{text-align:center}

.cal td.num{width:9%;vertical-align:middle}
.cal td.out{background:#f7f9fa}.cal td.fer{background:#fff9db}.cal td.tdy{outline:2px solid var(--blue);outline-offset:-2px}

.planT td{min-width:132px}
.planT th.ehead{min-width:132px;text-align:center;line-height:1.25;vertical-align:bottom}
.planT td.name{min-width:110px}

.cgridT th.ehead{min-width:62px;font-size:11px;line-height:1.2;vertical-align:bottom;font-weight:600}
.cgridT td.name{min-width:84px;font-weight:500}
.cgridT td.mrow{text-align:left;font-weight:700;text-transform:capitalize;background:var(--brand2);padding:5px 8px}
.cgridT .monT{border-top:2px solid var(--line)}
.cgridT td.tdyT{background:var(--brand);color:#fff}
.cgridT tr.totrow td{background:#fafcfb;border-top:2px solid var(--line);font-size:11px;text-align:center}
.cbig{font-size:14px}.cbig th.dh{min-width:70px}.cbig .cg{padding:8px 0;font-size:15px}.cbig td{padding:4px}.cgridT.cbig th.ehead{min-width:78px}
.sync{font-size:12px;font-weight:600}.s-ok{color:var(--ok)}.s-run{color:var(--muted)}.s-err{color:var(--bad)}
.btnlink{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--brand);text-decoration:none}
.login{max-width:380px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.login img{height:120px}.login h1{font-size:20px;margin:6px 0 14px}
.login form{text-align:left}.login label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}.login input{width:100%;font-size:17px;padding:11px}
.login button{width:100%;margin-top:18px;padding:13px;font-size:17px;font-weight:600}
#loginErr{margin-top:10px;color:var(--bad);text-align:center}

.toolbar{padding:12px 14px}
.tb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tb-row+.tb-row{margin-top:10px}
.tb-nav{display:flex;align-items:center;gap:6px}
.tb-label{min-width:200px;text-align:center}
.tb-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.dcard{margin:0}
.dchips{margin-top:8px}
.dchips .chip{font-size:13px;padding:6px 8px}
nav.tabs{-webkit-overflow-scrolling:touch}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

 header select{max-width:46vw;font-size:14px}

 nav.tabs{flex-wrap:nowrap;overflow-x:auto;padding:4px 8px 0;position:sticky;top:0;z-index:6;scrollbar-width:none}
 nav.tabs::-webkit-scrollbar{display:none}

 table{font-size:13px}
 th,td{padding:6px}
 .plan td{min-width:104px}.plan td.name{min-width:108px;max-width:120px}

<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Utilitaires dates / heures ====== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const mondayOf=s=>{const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1];};
const toHHMM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const hfr=t=>{const m=toMin(t);return Math.floor(m/60)+'h'+pad(m%60);};
const fmtD=m=>{const s=m<0?'−':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+'h'+pad(m%60);};
const dec=m=>(m/60).toFixed(2).replace('.',',');
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const JOURSL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dlabel=s=>{const d=parseYmd(s);return JOURS[d.getDay()]+' '+d.getDate()+'/'+pad(d.getMonth()+1);};
const dlong=s=>{const d=parseYmd(s);return JOURSL[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const TODAY=ymd(new Date());
const W0=mondayOf(TODAY);
const FERIES=['2026-01-01','2026-04-03','2026-04-06','2026-05-01','2026-05-08','2026-05-14','2026-05-22','2026-05-25','2026-07-14','2026-07-21','2026-08-15','2026-11-01','2026-11-11','2026-12-25','2027-01-01','2027-03-26','2027-03-29','2027-05-01','2027-05-06','2027-05-08','2027-05-17','2027-05-22'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ====== Référentiels (repris du planning d'octobre 2026) ====== */
const EMPS0=[];
let EMPS=EMPS0,EMP=Object.fromEntries(EMPS0.map(e=>[e.id,e]));
function refreshEmps(){const all=(S&&S.emps&&S.emps.length)?S.emps:EMPS0;EMP=Object.fromEntries(all.map(e=>[e.id,e]));EMPS=all.filter(e=>e.actif!==false).sort((a,b)=>((a.role==='chef'?0:1)-(b.role==='chef'?0:1))||String(a.nom).localeCompare(String(b.nom)));}
const fullName=id=>EMP[id]?EMP[id].prenom+' '+EMP[id].nom:id;
const SITES=['AUCHAN Ducos','AUCHAN Lamentin','AUCHAN Marin','AUCHAN FdeF','ANTIANE','CC Batelière','Géant Batelière','Groupe Ste Claire','CGFF','Cabinet Célestine','SCI Flériane','Blue Automobile','Blue Génipa','ETE','Carré d\'Eve','SCI Elec','Électrique Auto','HO HIO HEN','Bureau / contrôles','LA MAUNY'];
// days: 1=lun ... 7=dim
const T=(emp,site,days,s,e)=>({emp,site,days,s,e});
const TYPES=[];
const ABS_CODES={CP:'Congés payés',AM:'Arrêt maladie',AT:'Accident du travail',NJ:'Absence non justifiée',REC:'Récupération',CPD:'Congé événement familial',JF:'Jour férié chômé'};
const MOTIFS=['Surcharge / demande du client','Retard','Remplacement d\'un collègue','Départ anticipé','Oubli de pointage','Autre'];

/* ====== État ====== */
const KEY='socanet-proto-v2';
let S=null;
const newId=()=>uid('m');
function addIv(o){if(o.id&&S.ivs.some(i=>i.id===o.id))return null;const iv=Object.assign({id:newId(),rs:null,re:null,status:'prevue',motif:'',decision:null,source:'type',chantier:null},o);S.ivs.push(iv);return iv;}
function genWeek(w){
 if(!isMgrUser()||S.genWeeks.includes(w))return;
 if(addDays(w,6)<(S.params.goLive||'2000-01-01'))return;
 const ab=weekAB(w);
 for(let i=0;i<7;i++){const date=addDays(w,i);const di=i+1;
  S.types.forEach(t=>{if(t.days.includes(di)&&(t.wk==='all'||t.wk===ab)&&date>=(S.params.goLive||''))addIv({id:'g_'+t.id+'_'+date,emp:t.emp,site:t.site,date,ps:t.s,pe:t.e});});
  S.chantiers.forEach(c=>(c.slots||[]).forEach(sl=>{if(sl.date===date)addIv({id:'p_'+c.id+'_'+sl.emp+'_'+date+'_'+sl.s.replace(':',''),emp:sl.emp,site:c.site,date,ps:sl.s,pe:sl.e,source:'ponctuel',chantier:c.id});}));
 }
 S.genWeeks.push(w);
}
function absOf(emp,date){const a=S.abs.find(x=>x.emp===emp&&date>=x.from&&date<=x.to);return a?a.code:null;}

/* ====== Calculs ====== */
const dur=(a,b)=>Math.max(0,toMin(b)-toMin(a));
const plannedMin=iv=>dur(iv.ps,iv.pe);
const realMin=iv=>(iv.rs&&iv.re)?dur(iv.rs,iv.re):0;
function dispStatus(iv){
 if(absOf(iv.emp,iv.date))return 'absent';
 if(iv.status==='prevue'||iv.status==='en_cours'){
  const nm=nowMin();
  if(iv.date<TODAY||(iv.date===TODAY&&toMin(iv.ps)+30<=nm&&iv.status==='prevue')||(iv.date===TODAY&&iv.status==='en_cours'&&toMin(iv.pe)+60<=nm))return 'manquant';
 }
 return iv.status;
}
const ST_LABEL={prevue:'Prévue',en_cours:'En cours',ecart:'Écart à arbitrer',validee_chef:'Validée chef · à arbitrer',validee:'Validée',refusee:'Extra refusé',manquant:'Non pointée',absent:'Absent'};
function counted(iv){
 if(absOf(iv.emp,iv.date))return 0;
 if(!(iv.rs&&iv.re))return 0;
 const r=realMin(iv),p=plannedMin(iv);
 if(iv.status==='validee')return r;
 if(['refusee','ecart','validee_chef'].includes(iv.status))return Math.min(r,p);
 return 0;
}
const extraMin=iv=>Math.max(0,realMin(iv)-plannedMin(iv));
const recupOf=iv=>(iv.status==='validee'&&iv.decision==='recup')?extraMin(iv):0;
function overlap(a1,a2,b1,b2){return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1));}
function nightMin(iv){const c=counted(iv);if(!c)return 0;const s=toMin(iv.rs),e=s+c;const nd=toMin(S.params.nuitDebut),nf=toMin(S.params.nuitFin);return overlap(s,e,0,nf)+overlap(s,e,nd,1440);}
const isSun=d=>parseYmd(d).getDay()===0;
const isFer=d=>FERIES.includes(d);
function plafondMin(e,w){const f=S.params.plafond==='1/3'?1/3:1/10;return Math.round(hebdoW(e.id,w||S.week)*60*f);}
function wk(emp,w){
 const e=EMP[emp];const days=[];let total=0,planned=0,nuit=0,dim=0,fer=0,recup=0,pend=0;
 for(let i=0;i<7;i++){const d=addDays(w,i);let m=0,pl=0;
  S.ivs.filter(x=>x.emp===emp&&x.date===d).forEach(iv=>{const c=counted(iv);m+=c;nuit+=nightMin(iv);if(isSun(d))dim+=c;if(isFer(d))fer+=c;recup+=recupOf(iv);if(['ecart','validee_chef'].includes(iv.status))pend+=Math.max(0,realMin(iv)-plannedMin(iv));if(!absOf(emp,d)){planned+=plannedMin(iv);pl+=plannedMin(iv);}});
  days.push({d,m,pl,abs:absOf(emp,d)});total+=m;}
 const hw=hebdoW(emp,w);const contract=Math.round(hw*60);
 // absences rémunérées : comptent pour la durée prévue (CP, JF, REC, CPD)
 let absPaid=0;days.forEach(x=>{if(['CP','JF','REC','CPD'].includes(x.abs)){S.ivs.filter(i=>i.emp===emp&&i.date===x.d).forEach(i=>absPaid+=plannedMin(i));}});
 const pay=total-recup;const diff=total+absPaid-contract;
 let c10=0,c25=0,s25=0,s50=0;const partiel=hw<35;
 if(partiel){const comp=Math.max(0,pay-contract);const lim=Math.round(contract/10);c10=Math.min(comp,lim);c25=comp-c10;}
 else{const sup=Math.max(0,pay-35*60);s25=Math.min(sup,8*60);s50=sup-s25;}
 return {days,total,planned,contract,diff,c10,c25,s25,s50,nuit,dim,fer,recup,pend,partiel,absPaid};
}
function recupBalance(emp){let acq=0,taken=0;S.ivs.filter(i=>i.emp===emp).forEach(i=>{acq+=recupOf(i);if(absOf(emp,i.date)==='REC')taken+=plannedMin(i);});return {acq,taken,bal:acq-taken};}
function chantierStats(c){const ivs=S.ivs.filter(i=>i.chantier===c.id);let done=0,plan=0;ivs.forEach(i=>{const st=dispStatus(i);if(i.rs&&i.re)done+=counted(i)+(['ecart','validee_chef'].includes(i.status)?extraMin(i):0);else if(st!=='manquant'&&st!=='absent')plan+=plannedMin(i);});return {ivs,done,plan,tot:done+plan};}

function isoWeek(s){const d=parseYmd(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-fy)/864e5-3+((fy.getUTCDay()+6)%7))/7);}
function weekAB(w){const odd=isoWeek(w)%2===1;return (odd===(S.params.semA!=='paire'))?'A':'B';}
const CT=id=>S.contracts[id];
function hebdoW(id,w){const c=CT(id);return (c.alt&&weekAB(w)==='B')?c.hB:c.hA;}
function moyHebdo(id){const c=CT(id);return c.alt?(c.hA+c.hB)/2:c.hA;}
const mensuel=id=>Math.round(moyHebdo(id)*52/12*100)/100;
const fh=x=>String(Math.round(x*100)/100).replace('.',',');
function contractLabel(id,w){const c=CT(id);if(!c.alt)return c.type+' · '+fh(c.hA)+' h';return c.type+' · A '+fh(c.hA)+' h / B '+fh(c.hB)+' h'+(w?' · sem. '+weekAB(w):'');}

function typesWeekMin(emp,ab){return S.types.filter(t=>t.emp===emp&&(t.wk==='all'||t.wk===ab)).reduce((a,t)=>a+dur(t.s,t.e)*t.days.length,0);}
function siteTypesMin(site,ab){return S.types.filter(t=>t.site===site&&(t.wk==='all'||t.wk===ab)).reduce((a,t)=>a+dur(t.s,t.e)*t.days.length,0);}

 S.ivs=S.ivs.filter(i=>!(i.source==='type'&&i.status==='prevue'&&!i.rs&&i.date>=TODAY));
 S.genWeeks.forEach(w=>{const ab=weekAB(w);for(let k=0;k<7;k++){const date=addDays(w,k);if(date<TODAY)continue;
  S.types.forEach(t=>{if(!t.days.includes(k+1)||!(t.wk==='all'||t.wk===ab))return;addIv({id:'g_'+t.id+'_'+date,emp:t.emp,site:t.site,date,ps:t.s,pe:t.e});});}});

/* ====== Alertes ====== */
function alerts(){
 const out=[];const nm=nowMin();
 const miss=S.ivs.filter(i=>dispStatus(i)==='manquant');
 const pend=S.ivs.filter(i=>['ecart','validee_chef'].includes(i.status));
 miss.filter(i=>i.date===TODAY).forEach(i=>out.push({lvl:'bad',t:'Pointage manquant — '+fullName(i.emp),d:i.site+' · prévu '+hfr(i.ps)+'–'+hfr(i.pe)+' aujourd\'hui',iv:i.id}));
 const oldMiss=miss.filter(i=>i.date<TODAY);if(oldMiss.length)out.push({lvl:'bad',t:oldMiss.length+' intervention(s) passée(s) jamais pointée(s)',d:'À régulariser avant la clôture du mois',tab:'planning'});
 pend.forEach(i=>out.push({lvl:'warn',t:'Écart à arbitrer — '+fullName(i.emp)+(EMP[i.emp].role==='chef'?' (chef d\'équipe : arbitrage direct niveau 2)':''),d:dlabel(i.date)+' · '+i.site+' · prévu '+fmtD(plannedMin(i))+', pointé '+fmtD(realMin(i))+' · '+(i.motif||''),tab:'valid'}));
 EMPS.forEach(e=>{const w=wk(e.id,S.week);
  if(hebdoW(e.id,S.week)<35){const lim=plafondMin(e,S.week);const over=w.planned-w.contract;
   if(w.planned>=35*60)out.push({lvl:'bad',t:'Temps partiel planifié à 35 h ou plus — '+fullName(e.id),d:'Interdit : réduire le planning de la semaine'});
   else if(over>lim)out.push({lvl:'bad',t:'Planning au-delà du plafond d\'heures complémentaires — '+fullName(e.id),d:'Prévu '+fmtD(w.planned)+' pour un contrat de '+fmtD(w.contract)+' (plafond '+S.params.plafond+' = '+fmtD(lim)+') · semaine du '+dlabel(S.week)});
   else if(over>0&&over>=0.8*lim)out.push({lvl:'warn',t:'Plafond d\'heures complémentaires presque atteint — '+fullName(e.id),d:'Prévu '+fmtD(w.planned)+' / contrat '+fmtD(w.contract)+' · plafond '+fmtD(lim)});
  } else if(w.planned>35*60)out.push({lvl:'warn',t:'Heures supplémentaires prévues — '+fullName(e.id),d:'Prévu '+fmtD(w.planned)+' cette semaine'});
  if(w.planned>48*60)out.push({lvl:'bad',t:'Durée maximale hebdomadaire dépassée — '+fullName(e.id),d:'48 h max'});
 });
 S.chantiers.forEach(c=>{const st=chantierStats(c);if(st.tot>=0.8*c.vendues)out.push({lvl:st.tot>c.vendues?'bad':'warn',t:'Chantier ponctuel « '+c.libelle+' » : '+Math.round(st.tot/c.vendues*100)+' % des heures vendues',d:'Réalisé '+fmtD(st.done)+' + prévu '+fmtD(st.plan)+' pour '+fmtD(c.vendues)+' vendues',tab:'chantiers'});});
 return out;
}

/* ====== Actions ====== */
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function logA(txt){S.log.push({id:uid('l'),at:new Date().toLocaleString('fr-FR'),by:USER?USER.name:actorName(),txt});}
function actorName(){if(S.role==='admin')return 'Gérome';if(S.role==='gest')return 'Marthe';return EMP[S.who]?fullName(S.who):'?';}
function evaluate(iv){
 const diff=realMin(iv)-plannedMin(iv);
 iv.status=Math.abs(diff)>S.params.tol?'ecart':'validee';
 if(iv.status==='validee'){iv.decision=null;}
}
function act(a,id,extra){
 const iv=S.ivs.find(x=>x.id===id);
 const hm=toHHMM(nowMin());
 switch(a){
  case 'arrive':iv.rs=hm;iv.status='en_cours';logA('Arrivée '+fullName(iv.emp)+' '+iv.site+' '+hm);toast('Arrivée enregistrée à '+hfr(hm));break;
  case 'parti':if(!iv.rs)iv.rs=iv.ps;iv.re=hm;if(toMin(iv.re)<=toMin(iv.rs))iv.re=toHHMM(toMin(iv.rs)+1);evaluate(iv);logA('Départ '+fullName(iv.emp)+' '+iv.site+' '+hm);toast(iv.status==='ecart'?'Départ enregistré — écart signalé':'Départ enregistré');break;
  case 'asplanned':iv.rs=iv.ps;iv.re=iv.pe;iv.status='validee';iv.decision=null;iv.motif='';logA('Fait comme prévu '+fullName(iv.emp)+' '+iv.site+' '+iv.date);toast('Merci, c\'est noté');break;
  case 'chefok':iv.status='validee_chef';iv.chefBy=EMP[S.who].prenom;logA('Validation chef '+fullName(iv.emp)+' '+iv.date);toast('Validé, transmis à Marthe / Gérome');break;
  case 'payee':case 'recup':iv.status='validee';iv.decision=a;iv.validBy=actorName();logA('Extra accepté ('+(a==='payee'?'payé':'récupération')+') '+fullName(iv.emp)+' '+iv.date);toast('Accepté : '+(a==='payee'?'payé':'mis en récupération'));break;
  case 'accept-short':iv.status='validee';iv.decision=null;iv.validBy=actorName();logA('Écart validé '+fullName(iv.emp)+' '+iv.date);toast('Validé');break;
  case 'refuse':iv.status='refusee';iv.validBy=actorName();logA('Extra refusé '+fullName(iv.emp)+' '+iv.date);toast('Refusé : seules les heures prévues sont retenues');break;
 }
 save();render();
}

const monthStart=s=>s.slice(0,8)+'01';
const addMonths=(s,n)=>{const d=parseYmd(monthStart(s));d.setMonth(d.getMonth()+n);return ymd(d);};
const monthEnd=s=>addDays(addMonths(s,1),-1);
function pvState(){if(!S.pv)S.pv={mode:(window.innerWidth<760?'day':'week'),emp:'all',team:'all',site:'all'};if(!S.pday||S.pday<addDays(TODAY,-60))S.pday=TODAY;if(!S.pv.orient)S.pv.orient='rows';if(!S.pv.detail)S.pv.detail='full';if(!S.pmonth)S.pmonth=monthStart(TODAY);return S.pv;}
function pvPeriod(){const pv=pvState();if(pv.mode==='day')return [S.pday||TODAY,S.pday||TODAY];if(pv.mode==='week')return [S.week,addDays(S.week,6)];if(pv.mode==='month')return [S.pmonth,monthEnd(S.pmonth)];return [S.pmonth,monthEnd(addMonths(S.pmonth,2))];}
function pvEmps(){const pv=pvState();return EMPS.filter(e=>(pv.emp==='all'||e.id===pv.emp)&&(pv.team==='all'||e.chef===pv.team||e.id===pv.team));}
const pvSiteOk=i=>{const pv=pvState();return pv.site==='all'||i.site===pv.site;};
function daysIn(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out;}
function ensureRange(a,b){let ch=false;for(let w=mondayOf(a);w<=b;w=addDays(w,7))if(!S.genWeeks.includes(w)){genWeek(w);ch=true;}if(ch)save();}
function chipHtml(i){const st=dispStatus(i);return '<span class="chip c-'+st+(i.chantier?' c-ponct':'')+'" data-editiv="'+i.id+'" title="'+ST_LABEL[st]+'"><b>'+esc(i.site)+'</b><br>'+hfr(i.ps)+'–'+hfr(i.pe)+(i.rs&&i.re&&(i.rs!==i.ps||i.re!==i.pe)?'<br><span class="small">pointé '+hfr(i.rs)+'–'+hfr(i.re)+'</span>':'')+'</span>';}
function dayIvs(emp,d){return S.ivs.filter(i=>i.emp===emp&&i.date===d&&pvSiteOk(i)).sort((a,b)=>a.ps.localeCompare(b.ps));}
function periodTotals(emp,days){let pl=0,real=0;days.forEach(d=>{if(absOf(emp,d))return;S.ivs.filter(i=>i.emp===emp&&i.date===d&&pvSiteOk(i)).forEach(i=>{pl+=plannedMin(i);real+=counted(i);});});return {pl,real,contract:Math.round(days.reduce((a,d)=>a+hebdoW(emp,mondayOf(d))*60/7,0))};}
function pvToolbar(){
 const pv=pvState();const [a,b]=pvPeriod();
 const modes=[['day','Jour'],['week','Semaine'],['month','Mois'],['quarter','3 mois']];
 let label;
 if(pv.mode==='day')label=dlong(a).charAt(0).toUpperCase()+dlong(a).slice(1)+(a===TODAY?' · aujourd\'hui':'');
 else if(pv.mode==='week')label='Sem. '+weekAB(a)+' · '+dlabel(a)+' → '+dlabel(b);
 else{const d1=parseYmd(a),d2=parseYmd(b);label=pv.mode==='month'?MOIS[d1.getMonth()]+' '+d1.getFullYear():MOIS[d1.getMonth()]+' → '+MOIS[d2.getMonth()]+' '+d2.getFullYear();label=label.charAt(0).toUpperCase()+label.slice(1);}
 const navAttr=pv.mode==='day'?'data-pday':pv.mode==='week'?'data-wk':'data-pnav';const step=pv.mode==='day'?1:pv.mode==='week'?7:(pv.mode==='month'?1:3);
 const chefs=EMPS.filter(e=>e.role==='chef');
 const showView=pv.mode==='week';const showOrient=pv.mode==='week'||((pv.mode==='month'||pv.mode==='quarter')&&pv.emp==='all');
 return '<div class="card toolbar">'+
 '<div class="tb-row"><div class="seg seg-modes">'+modes.map(m=>'<button data-pmode="'+m[0]+'" class="'+(pv.mode===m[0]?'on':'')+'">'+m[1]+'</button>').join('')+'</div>'+
 '<div class="tb-nav"><button class="nav-btn" '+navAttr+'="-'+step+'" aria-label="Précédent">◀</button><b class="tb-label">'+label+'</b><button class="nav-btn" '+navAttr+'="'+step+'" aria-label="Suivant">▶</button><button '+navAttr+'="0">Aujourd\'hui</button></div></div>'+
 '<div class="tb-row">'+(showView?'<div class="seg" title="Affichage"><button data-detail="full" class="'+(pv.detail==='full'?'on':'')+'">Chantiers + heures</button><button data-detail="hours" class="'+(pv.detail==='hours'?'on':'')+'">Heures seules</button></div>':'')+
 (showOrient?'<div class="seg hide-phone" title="Disposition"><button data-orient="rows" class="'+(pv.orient==='rows'?'on':'')+'">Noms à gauche</button><button data-orient="cols" class="'+(pv.orient==='cols'?'on':'')+'">Noms en haut</button></div>':'')+
 '<div class="tb-filters"><select id="pvEmp" aria-label="Personne">'+opts([['all','Toutes les personnes']].concat(EMPS.map(e=>[e.id,e.prenom+' '+e.nom])),pv.emp)+'</select>'+
 '<select id="pvTeam" aria-label="Équipe">'+opts([['all','Toutes les équipes']].concat(chefs.map(c=>[c.id,'Équipe '+c.prenom])),pv.team)+'</select>'+
 '<select id="pvSite" aria-label="Site">'+opts([['all','Tous les sites']].concat(siteList().map(s=>[s,s])),pv.site)+'</select>'+
 ((pv.emp!=='all'||pv.team!=='all'||pv.site!=='all')?'<button data-pvreset>Effacer</button>':'')+'<button class="pri" data-absadd="">+ Absence</button></div></div></div>';
}
function dayView(emps,d){
 const ab0=emps.map(e=>({e,ab:absOf(e.id,d),ivs:dayIvs(e.id,d)})).filter(x=>x.ab||x.ivs.length||pvState().site==='all');
 const working=ab0.filter(x=>x.ivs.length&&!x.ab),absents=ab0.filter(x=>x.ab),off=ab0.filter(x=>!x.ab&&!x.ivs.length);
 const all=working.flatMap(x=>x.ivs);const sts=all.map(dispStatus);
 let h='<div class="grid4 kpis-day"><div class="kpi"><div class="n">'+working.length+'</div><div class="l">salariés planifiés</div></div><div class="kpi ok"><div class="n">'+sts.filter(s=>s==='validee').length+' / '+all.length+'</div><div class="l">interventions pointées</div></div><div class="kpi '+(sts.includes('manquant')?'bad':'ok')+'"><div class="n">'+sts.filter(s=>s==='manquant').length+'</div><div class="l">non pointées</div></div><div class="kpi '+(sts.some(s=>s==='ecart'||s==='validee_chef')?'warn':'ok')+'"><div class="n">'+sts.filter(s=>s==='ecart'||s==='validee_chef').length+'</div><div class="l">écarts</div></div></div>';
 h+='<div class="daylist">'+working.map(x=>{const tot=x.ivs.reduce((t,i)=>t+(i.rs&&i.re?counted(i):plannedMin(i)),0);return '<div class="card dcard"><div class="row" style="justify-content:space-between"><div><b>'+esc(x.e.prenom+' '+x.e.nom)+'</b><div class="small muted">'+contractLabel(x.e.id,mondayOf(d))+'</div></div><div class="tot"><b>'+fmtD(tot)+'</b></div></div><div class="dchips">'+x.ivs.map(chipHtml).join('')+'</div><div class="add" data-addiv="'+x.e.id+'|'+d+'">+ intervention</div></div>';}).join('')+'</div>';
 if(absents.length)h+='<div class="card"><h2>Absents</h2>'+absents.map(x=>'<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">'+esc(x.e.prenom+' '+x.e.nom)+'</span><span class="pill st-absent">'+x.ab+'</span> <span class="small muted">'+esc(ABS_CODES[x.ab])+'</span></div>').join('')+'</div>';
 if(off.length)h+='<div class="card"><h2>Repos</h2><div class="small muted">'+off.map(x=>esc(x.e.prenom+' '+x.e.nom)).join(' · ')+'</div><div class="row" style="margin-top:8px;flex-wrap:wrap">'+off.map(x=>'<span class="add" style="padding:4px 8px" data-addiv="'+x.e.id+'|'+d+'">+ '+esc(x.e.prenom)+'</span>').join('')+'</div></div>';
 return h;

function planningView(){
 const pv=pvState();const [a,b]=pvPeriod();ensureRange(a,b);
 const emps=pvEmps();const days=daysIn(a,b);
 let h=pvToolbar();
 h+='<div class="legend">'+['validee','ecart','manquant','en_cours','prevue','refusee','absent'].map(s=>'<span class="pill st-'+s+'">'+ST_LABEL[s]+'</span>').join('')+'<span class="pill" style="box-shadow:inset 0 0 0 1px #7c5cd6">chantier ponctuel</span><span class="pill" style="background:#fff9db">jour férié</span></div>';
 if(!emps.length)return h+'<div class="card muted">Aucune personne ne correspond aux filtres.</div>';
 if(pv.mode==='day')h+=dayView(emps,a);
 else if(pv.mode==='week'&&pv.detail==='hours')h+=pv.orient==='cols'?compactGridT(emps,days,true):compactGrid(emps,days,true);
 else if(pv.mode==='week')h+=pv.orient==='cols'?weekGridT(emps,days):weekGrid(emps,days);
 else if(emps.length===1)h+=calendarView(emps[0],a,b);
 else h+=pv.orient==='cols'?compactGridT(emps,days):compactGrid(emps,days);
 const absList=S.abs.filter(x=>x.to>=a&&x.from<=b&&emps.some(e=>e.id===x.emp));
 if(absList.length)h+='<div class="card"><h2>Absences sur la période</h2><table>'+absList.map(x=>'<tr><td>'+esc(fullName(x.emp))+'</td><td><span class="pill st-absent">'+x.code+'</span> '+esc(ABS_CODES[x.code])+'</td><td>du '+dlabel(x.from)+' au '+dlabel(x.to)+'</td><td><button class="sm" data-delabs="'+x.id+'">Supprimer</button></td></tr>').join('')+'</table></div>';
 return h;
}
function pvEmpsShown(emps,days){const pv=pvState();if(pv.site==='all')return emps;return emps.filter(e=>days.some(d=>dayIvs(e.id,d).length));}
function empHead(e,w){return '<b>'+esc(e.prenom)+'</b><br>'+esc(e.nom)+'<div class="small muted" style="font-weight:400">'+contractLabel(e.id,w)+'</div>';}
function weekGridT(emps,days){
 emps=pvEmpsShown(emps,days);

 h+='<div class="card scroll" style="padding:0;max-height:78vh"><table class="plan planT"><thead><tr><th class="name">Date</th>'+emps.map(e=>'<th class="ehead">'+empHead(e,days[0])+'</th>').join('')+'</tr></thead><tbody>';
 days.forEach(d=>{const dd=parseYmd(d);const cls=isFer(d)?'fer':((dd.getDay()%6===0)?'wk':'');
  h+='<tr><td class="name '+cls+'">'+JOURSL[dd.getDay()].charAt(0).toUpperCase()+JOURSL[dd.getDay()].slice(1)+' '+dd.getDate()+(isFer(d)?'<div class="small muted">férié</div>':'')+(d===TODAY?'<div class="small" style="color:var(--brand)">aujourd\'hui</div>':'')+'</td>';
  emps.forEach(e=>{const ab=absOf(e.id,d);h+='<td class="'+cls+'">';if(ab)h+='<span class="chip c-abs"><b>'+ab+'</b> '+esc(ABS_CODES[ab])+'</span>';else{dayIvs(e.id,d).forEach(i=>h+=chipHtml(i));h+='<div class="add" data-addiv="'+e.id+'|'+d+'">+</div>';}h+='</td>';});
  h+='</tr>';});
 h+='<tr class="totrow"><td class="name">Prévu / contrat</td>'+emps.map(e=>{const w=wk(e.id,days[0]);const hw=hebdoW(e.id,days[0]);const lim=hw<35?plafondMin(e,days[0]):0;const over=hw<35?(w.planned-w.contract>lim):(w.planned>35*60);return '<td class="num tot '+(over?'over':'')+'">'+fmtD(w.planned)+' / '+fmtD(w.contract)+'</td>';}).join('')+'</tr>';
 return h+'</tbody></table></div>';

function dayModal(emp,d){const ab=absOf(emp,d);const ivs=S.ivs.filter(i=>i.emp===emp&&i.date===d).sort((a,b)=>a.ps.localeCompare(b.ps));
 modal('<h3>'+esc(fullName(emp))+'</h3><div class="muted">'+dlong(d)+'</div><div style="margin-top:10px">'+(ab?'<span class="chip c-abs"><b>'+ab+'</b> '+esc(ABS_CODES[ab])+'</span>':(ivs.map(chipHtml).join('')||'<div class="muted">Aucune intervention.</div>'))+'</div><div class="small muted" style="margin-top:6px">Total : '+fmtD(ivs.reduce((a,i)=>a+(i.rs&&i.re?counted(i):plannedMin(i)),0))+'</div><div class="acts">'+(ab?'':'<button type="button" data-addiv="'+emp+'|'+d+'">+ Intervention</button>')+'<button type="button" class="pri" data-close>Fermer</button></div>',()=>{});
 modalEl.addEventListener('click',ev=>{const c=ev.target.closest('[data-editiv],[data-addiv]');if(!c)return;if(c.dataset.editiv)ivModal(c.dataset.editiv);else{const [e2,d2]=c.dataset.addiv.split('|');ivModal(null,e2,d2);}});}
function compactGridT(emps,days,big){

 h+='<div class="card scroll" style="padding:0;max-height:80vh"><table class="cgrid cgridT'+(big?' cbig':'')+'"><thead><tr><th class="name">Date</th>'+emps.map(e=>'<th class="ehead">'+esc(e.prenom)+'<br>'+esc(e.nom)+'</th>').join('')+'</tr></thead><tbody>';
 let curM='';
 days.forEach(d=>{const dd=parseYmd(d);const m=d.slice(0,7);
  if(m!==curM){curM=m;h+='<tr><td class="mrow" colspan="'+(emps.length+1)+'">'+MOIS[dd.getMonth()]+' '+dd.getFullYear()+'</td></tr>';}

  emps.forEach(e=>{const ab=absOf(e.id,d);if(ab)h+='<td class="'+base+'"><span class="cg cg-abs" title="'+esc(ABS_CODES[ab])+'">'+ab+'</span></td>';else{const c=cellClass(e.id,d);h+='<td class="'+base+'">'+(c.txt?'<span class="cg '+c.cls+'" data-gocell="'+e.id+'|'+d+'" title="'+esc(c.tip)+'">'+c.txt+'</span>':'')+'</td>';}});
  h+='</tr>';});
 h+='<tr class="totrow"><td class="name">Prévu</td>'+emps.map(e=>'<td class="num tot">'+fmtD(periodTotals(e.id,days).pl)+'</td>').join('')+'</tr>';
 h+='<tr class="totrow"><td class="name">Réalisé / contrat</td>'+emps.map(e=>{const t=periodTotals(e.id,days);return '<td class="num tot '+(t.real>t.contract*1.1?'over':'')+'">'+fmtD(t.real)+'<br><span class="muted">/ '+fmtD(t.contract)+'</span></td>';}).join('')+'</tr>';
 return h+'</tbody></table></div><div class="small muted">Contrat ramené à la période (horaire hebdo × nombre de jours / 7).</div>';

function weekGrid(emps,days){
 const pv=pvState();
 let h='<div class="small muted" style="margin-bottom:8px">Clique sur une intervention pour la modifier ou pointer à la place du salarié · « + » pour ajouter une intervention ponctuelle.</div>';
 h+='<div class="card scroll" style="padding:0;max-height:75vh"><table class="plan"><thead><tr><th class="name">Salarié</th>'+days.map(d=>'<th class="'+(isFer(d)?'fer':'')+'">'+dlabel(d)+(isFer(d)?' · férié':'')+(d===TODAY?' · auj.':'')+'</th>').join('')+'<th class="num">Prévu / contrat</th></tr></thead><tbody>';
 emps.forEach(e=>{const w=wk(e.id,days[0]);const hw=hebdoW(e.id,days[0]);const lim=hw<35?plafondMin(e,days[0]):0;const over=hw<35?(w.planned-w.contract>lim):(w.planned>35*60);
  const rowIvs=days.map(d=>dayIvs(e.id,d));if(pv.site!=='all'&&!rowIvs.some(x=>x.length))return;

  days.forEach((d,k)=>{const ab=absOf(e.id,d);
   h+='<td class="'+(isFer(d)?'fer':((parseYmd(d).getDay()%6===0)?'wk':''))+'">';
   if(ab)h+='<span class="chip c-abs"><b>'+ab+'</b> '+esc(ABS_CODES[ab])+'</span>';
   else{rowIvs[k].forEach(i=>h+=chipHtml(i));h+='<div class="add" data-addiv="'+e.id+'|'+d+'">+</div>';}
   h+='</td>';});
  h+='<td class="num tot '+(over?'over':'')+'">'+fmtD(w.planned)+' / '+fmtD(w.contract)+'</td></tr>';});
 return h+'</tbody></table></div>';

function cellClass(emp,d){const ivs=dayIvs(emp,d);if(!ivs.length)return {cls:'',txt:''};
 const sts=ivs.map(dispStatus);let cls='cg-prev';
 if(sts.includes('manquant'))cls='cg-miss';else if(sts.some(s=>s==='ecart'||s==='validee_chef'))cls='cg-ecart';else if(sts.includes('en_cours'))cls='cg-cours';else if(sts.every(s=>s==='validee'||s==='refusee'))cls='cg-ok';
 const real=ivs.reduce((t,i)=>t+counted(i),0),pl=ivs.reduce((t,i)=>t+plannedMin(i),0);
 const txt=(cls==='cg-prev'||cls==='cg-miss'||cls==='cg-cours')?dec(pl):dec(real);
 return {cls:cls+(ivs.some(i=>i.chantier)?' cg-ponct':''),txt:txt.replace(',00',''),tip:ivs.map(i=>i.site+' '+hfr(i.ps)+'–'+hfr(i.pe)+' ('+ST_LABEL[dispStatus(i)]+')').join('\n')};}
function compactGrid(emps,days,big){
 const pv=pvState();

 // en-tête mois

 h+='<tr><th class="name">Salarié</th>'+days.map(d=>{const dd=parseYmd(d);return '<th class="dh '+(isFer(d)?'fer':(dd.getDay()%6===0?'wk':''))+(d===TODAY?' tdy':'')+(dd.getDay()===1?' mon':'')+'">'+'LMMJVSD'.charAt((dd.getDay()+6)%7)+'<br>'+dd.getDate()+'</th>';}).join('')+'<th class="num">Prévu</th><th class="num">Réalisé / contrat</th></tr></thead><tbody>';

   if(ab)h+='<td class="'+base+'"><span class="cg cg-abs" title="'+esc(ABS_CODES[ab])+'">'+ab+'</span></td>';

 return h+'</tbody></table></div><div class="small muted">Contrat ramené à la période (horaire hebdo × nombre de jours / 7).</div>';

function validView(){

  if(i.status==='prevue')b='<div class="btns"><button class="pri" data-act="arrive" data-id="'+i.id+'">Arrivé</button><button class="ok" data-act="asplanned" data-id="'+i.id+'">Fait comme prévu</button><button class="full" data-ecart="'+i.id+'">Horaires différents…</button></div>';

});
document.addEventListener('change',ev=>{if(ev.target.id==='tyEmp'){S.tyEmp=ev.target.value;save();render();return;}const pm={pvEmp:'emp',pvTeam:'team',pvSite:'site'}[ev.target.id];if(pm){pvState()[pm]=ev.target.value;save();render();return;}if(ev.target.id==='roleSel'){const [r,w]=ev.target.value.split('|');S.role=r;S.who=w;S.ptab='today';S.day=TODAY;save();render();}});
document.addEventListener('submit',ev=>{if(ev.target.id==='paramsForm'){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());const oldA=S.params.semA;S.params={tol:Math.max(0,+f.tol||0),plafond:f.plafond,nuitDebut:f.nuitDebut,nuitFin:f.nuitFin,semA:f.semA};if(oldA!==f.semA)regenFuture();logA('Paramètres modifiés');save();render();toast('Paramètres enregistrés');}});

/* ====== Serveur : synchronisation, comptes ====== */
let USER=null,VERSION=0,SNAP={},syncing=false,pendingSync=false,rerenderPending=false,USERS=null,SYNC_STATE='ok';
const COLLS=['ivs','abs','types','contrats','chantiers','emps','contracts','params','log','weeks'];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isMgrUser=()=>USER&&(USER.role==='admin'||USER.role==='gest');
const PARAMS_DEF={tol:15,plafond:'1/10',nuitDebut:'21:00',nuitFin:'06:00',semA:'impaire',goLive:'2000-01-01'};
async function api(url,body,method){const r=await fetch(url,{method:method||(body!==undefined?'POST':'GET'),credentials:'same-origin',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});let j={};try{j=await r.json();}catch(e){}if(!r.ok){const e=new Error(j.error||('Erreur '+r.status));e.status=r.status;throw e;}return j;}
function docsOf(c){switch(c){case 'contracts':return Object.entries(S.contracts||{}).map(([id,v])=>Object.assign({id},v));case 'params':return [Object.assign({id:'p'},S.params)];case 'weeks':return (S.genWeeks||[]).map(w=>({id:w}));default:return S[c]||[];}}
function setColl(c,arr){switch(c){case 'contracts':S.contracts=Object.fromEntries(arr.map(d=>{const v=Object.assign({},d);delete v.id;return [d.id,v];}));break;case 'params':{const p=Object.assign({},PARAMS_DEF,arr.find(d=>d.id==='p')||{});delete p.id;S.params=p;break;}case 'weeks':S.genWeeks=arr.map(d=>d.id);break;default:S[c]=arr;}}
function computeChanges(){const ch={};let n=0;COLLS.forEach(c=>{if(!isMgrUser()&&!['ivs','log'].includes(c))return;const snap=SNAP[c]||{};const cur={};docsOf(c).forEach(d=>{cur[d.id]=JSON.stringify(d);});const up=[],del=[];for(const id in cur)if(cur[id]!==snap[id])up.push(JSON.parse(cur[id]));if(isMgrUser())for(const id in snap)if(!(id in cur))del.push(id);if(up.length||del.length){ch[c]={up,del};n+=up.length+del.length;}});return n?ch:null;}
function applyDelta(r){
 if(r.full){COLLS.forEach(c=>{const arr=r.up[c]||[];SNAP[c]={};arr.forEach(d=>SNAP[c][d.id]=JSON.stringify(d));setColl(c,arr);});}
 else COLLS.forEach(c=>{const ups=r.up[c]||[],dels=r.del[c]||[];if(!ups.length&&!dels.length)return;const m=new Map(docsOf(c).map(d=>[d.id,d]));SNAP[c]=SNAP[c]||{};ups.forEach(d=>{m.set(d.id,d);SNAP[c][d.id]=JSON.stringify(d);});dels.forEach(id=>{m.delete(id);delete SNAP[c][id];});setColl(c,[...m.values()]);});
 VERSION=r.version;refreshEmps();
}
const UIKEYS=['tab','week','pday','ptab','pv','pmonth','tyEmp','role','who'];
function saveUi(){try{localStorage.setItem('socanet-ui-'+USER.login,JSON.stringify(Object.fromEntries(UIKEYS.map(k=>[k,S[k]]))));}catch(e){}}
let syncTimer=null;
function save(){if(!USER)return;saveUi();clearTimeout(syncTimer);syncTimer=setTimeout(doSync,300);}
function setSync(s){SYNC_STATE=s;const el=document.getElementById('syncState');if(el){el.className='sync s-'+s;el.textContent=s==='ok'?'● Enregistré':s==='run'?'● Enregistrement…':'● Hors ligne : en attente';}}
async function fullReload(){const r=await api('/api/state?since=0');applyDelta(r);render();}
async function doSync(){
 if(syncing){pendingSync=true;return;}
 const ch=computeChanges();if(!ch){setSync('ok');return;}
 syncing=true;setSync('run');
 try{const r=await api('/api/sync',{since:VERSION,changes:ch});applyDelta(r);setSync('ok');}
 catch(e){if(e.status===401){location.reload();return;}if(e.status&&e.status<500){toast(e.message);try{await fullReload();}catch(x){}setSync('ok');}else setSync('err');}
 finally{syncing=false;}
 if(pendingSync){pendingSync=false;doSync();}else safeRender();
}
async function poll(){
 if(syncing||!USER)return;
 if(computeChanges()){doSync();return;}
 try{const r=await api('/api/state?since='+VERSION);const any=Object.keys(r.up).length||Object.keys(r.del).length;if(any){applyDelta(r);safeRender();}else VERSION=Math.max(VERSION,r.version);if(SYNC_STATE==='err')setSync('ok');}
 catch(e){if(e.status===401)location.reload();else setSync('err');}
}
function safeRender(){if(modalEl){rerenderPending=true;return;}const y=window.scrollY;render();window.scrollTo(0,y);}
async function loadUsers(){try{USERS=await api('/api/users');}catch(e){USERS=[];}}
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function userOfEmp(id){return (USERS||[]).find(u=>u.emp===id&&u.active);}
function codeModal(id){const e=EMP[id];const u=userOfEmp(id);const login=u?u.login:(slug(e.prenom)+'.'+slug(e.nom).slice(0,1));
 modal('<h3>Accès de '+esc(fullName(id))+'</h3><div class="small muted">Le salarié se connecte avec cet identifiant et un code à 6 chiffres. Générer un nouveau code annule l\'ancien et déconnecte ses appareils.</div><label>Identifiant</label><input name="login" required value="'+esc(login)+'" pattern="[a-z0-9._-]{3,40}"><div class="acts"><button type="button" data-close>Annuler</button><button class="pri" type="submit">'+(u&&u.hasCode?'Générer un nouveau code':'Créer l\'accès')+'</button></div>',
 f=>{api('/api/users',{login:f.login.trim().toLowerCase(),role:e.role==='chef'?'chef':'sal',emp:id,name:fullName(id),newCode:true}).then(r=>{logA('Code d\'accès généré pour '+fullName(id));save();loadUsers().then(()=>{modal('<h3>Code de '+esc(fullName(id))+'</h3><div style="font-size:15px;line-height:1.8">Adresse : <b>'+esc(location.host)+'</b><br>Identifiant : <b>'+esc(r.login)+'</b><br>Code : <b style="font-size:26px;letter-spacing:4px">'+esc(r.code)+'</b></div><div class="small muted" style="margin-top:8px">Note-le et remets-le en main propre : il ne sera plus affiché.</div><div class="acts"><button type="button" class="pri" data-close>C\'est noté</button></div>',()=>{});});}).catch(err=>toast(err.message));});}
function gestModal(login){const u=login?(USERS||[]).find(x=>x.login===login):null;
 modal('<h3>'+(u?'Compte gestionnaire':'Nouveau compte gestionnaire')+'</h3><label>Identifiant</label><input name="login" required value="'+esc(u?u.login:'marthe')+'" '+(u?'readonly':'')+'><label>Nom affiché</label><input name="name" required value="'+esc(u?u.name:'Marthe')+'"><label>Mot de passe '+(u?'(laisser vide pour ne pas changer)':'')+'</label><input type="password" name="password" minlength="10" '+(u?'':'required')+' autocomplete="new-password"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="active" style="width:auto" '+(!u||u.active?'checked':'')+'> Compte actif</label><div class="acts"><button type="button" data-close>Annuler</button><button class="pri" type="submit">Enregistrer</button></div>',
 f=>{api('/api/users',{login:f.login.trim().toLowerCase(),name:f.name,role:'gest',password:f.password||undefined,active:!!f.active}).then(()=>{toast('Compte enregistré');loadUsers().then(()=>{closeModal();render();});}).catch(err=>toast(err.message));return false;});}
function pwdModal(){modal('<h3>Changer mon mot de passe</h3><label>Mot de passe actuel</label><input type="password" name="old" required autocomplete="current-password"><label>Nouveau mot de passe (10 caractères minimum)</label><input type="password" name="password" minlength="10" required autocomplete="new-password"><label>Confirmer</label><input type="password" name="password2" required autocomplete="new-password"><div class="acts"><button type="button" data-close>Annuler</button><button class="pri" type="submit">Enregistrer</button></div>',
 f=>{if(f.password!==f.password2){toast('Les deux mots de passe sont différents');return false;}api('/api/password',{old:f.old,password:f.password}).then(()=>{toast('Mot de passe modifié');closeModal();}).catch(e=>toast(e.message));return false;});}
function empModal(id){const e=id?EMP[id]:null;const c=id?CT(id):{type:'CDI',alt:false,hA:20,hB:20};const chefs=(S.emps||[]).filter(x=>x.role==='chef'&&x.actif!==false&&x.id!==id);
 modal('<h3>'+(e?'Fiche — '+esc(fullName(id)):'Nouveau salarié')+'</h3><div class="row"><div style="flex:1"><label>Prénom</label><input name="prenom" required value="'+esc(e?e.prenom:'')+'"></div><div style="flex:1"><label>Nom</label><input name="nom" required value="'+esc(e?e.nom:'')+'"></div></div><div class="row"><div style="flex:1"><label>Fonction</label><select name="role">'+opts([['sal','Salarié'],['chef','Chef d\'équipe']],e&&e.role==='chef'?'chef':'sal')+'</select></div><div style="flex:1"><label>Chef d\'équipe</label><select name="chef">'+opts([['','—']].concat(chefs.map(x=>[x.id,x.prenom+' '+x.nom])),e?e.chef||'':'')+'</select></div></div>'+
 '<div class="row"><div style="flex:1"><label>Contrat</label><select name="type">'+opts(['CDI','CDD'],c.type)+'</select></div><div style="flex:1"><label>Heures / semaine (ou semaine A)</label><input type="number" step="0.25" min="0" max="48" name="hA" required value="'+c.hA+'"></div></div><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="alt" style="width:auto" '+(c.alt?'checked':'')+' onchange="this.form.hB.disabled=!this.checked"> Horaire différent en semaine A et semaine B</label><label>Heures en semaine B</label><input type="number" step="0.25" min="0" max="48" name="hB" value="'+c.hB+'" '+(c.alt?'':'disabled')+'>'+
 (e?'<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="actif" style="width:auto" '+(e.actif!==false?'checked':'')+'> Salarié présent dans l\'entreprise (décocher à la sortie)</label>':'')+'<div class="small muted" style="margin-top:8px">Un changement de forfait doit correspondre à un avenant signé.</div><div class="acts"><button type="button" data-close>Annuler</button><button class="pri" type="submit">Enregistrer</button></div>',
 f=>{let eid=id;if(!e){eid=slug(f.prenom)+'-'+slug(f.nom);while((S.emps||[]).some(x=>x.id===eid))eid+='2';S.emps.push({id:eid});}
  const o=(S.emps.find(x=>x.id===eid));Object.assign(o,{nom:f.nom.trim().toUpperCase(),prenom:f.prenom.trim(),role:f.role==='chef'?'chef':undefined,chef:f.chef||undefined,actif:e?!!f.actif:true,type:f.type});if(o.role!=='chef')delete o.role;if(!o.chef)delete o.chef;
  S.contracts[eid]={type:f.type,alt:!!f.alt,hA:Math.max(0,+f.hA||0),hB:f.alt?Math.max(0,+f.hB||0):Math.max(0,+f.hA||0)};refreshEmps();
  logA((e?'Fiche modifiée : ':'Salarié ajouté : ')+fullName(eid)+' · '+contractLabel(eid));toast('Enregistré');});}
function loginView(){app.innerHTML='<div class="login"><img src="/logo.png" alt="Socanet Services"><h1>Planning & pointage</h1><form id="loginForm"><label>Identifiant</label><input name="login" autocomplete="username" autocapitalize="none" required><label>Code</label><input name="code" type="password" autocomplete="current-password" required><button class="pri" type="submit">Se connecter</button><div class="small muted" id="loginErr"></div></form></div>';
 document.getElementById('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());try{await api('/api/login',{login:f.login,code:f.code});location.reload();}catch(e){document.getElementById('loginErr').textContent=e.message;}});}
function setupView(){app.innerHTML='<div class="login"><img src="/logo.png" alt="Socanet Services"><h1>Installation</h1><div class="small muted">Crée le compte administrateur. Le code d\'installation t\'a été transmis lors de la mise en ligne.</div><form id="setupForm"><label>Code d\'installation</label><input name="token" required><label>Identifiant administrateur</label><input name="login" value="gerome" required><label>Nom</label><input name="name" value="Gérome" required><label>Mot de passe (10 caractères minimum)</label><input name="password" type="password" minlength="10" required autocomplete="new-password"><label>Confirmer</label><input name="password2" type="password" required autocomplete="new-password"><button class="pri" type="submit">Créer le compte</button><div class="small muted" id="loginErr"></div></form></div>';
 document.getElementById('setupForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());if(f.password!==f.password2){document.getElementById('loginErr').textContent='Les deux mots de passe sont différents';return;}try{await api('/api/setup',f);location.reload();}catch(e){document.getElementById('loginErr').textContent=e.message;}});}
async function boot(){
 let me;try{me=await api('/api/me');}catch(e){app.innerHTML='<div class="login"><h1>Serveur injoignable</h1><div class="muted">Vérifie ta connexion puis recharge la page.</div></div>';return;}
 if(me.setup)return setupView();
 if(!me.user)return loginView();
 USER=me.user;
 S={ivs:[],abs:[],types:[],contrats:[],chantiers:[],emps:[],contracts:{},params:Object.assign({},PARAMS_DEF),log:[],genWeeks:[],tab:'dash',week:W0,ptab:'today'};
 let ui={};try{ui=JSON.parse(localStorage.getItem('socanet-ui-'+USER.login)||'{}');}catch(e){}
 UIKEYS.forEach(k=>{if(ui[k]!==undefined)S[k]=ui[k];});
 S.day=TODAY;if(!S.week||S.week<addDays(W0,-56))S.week=W0;
 if(USER.role==='admin'){if(!ui.role){S.role='admin';S.who=USER.login;}}else{S.role=USER.role;S.who=USER.emp||USER.login;}
 await fullReload();
 if(isMgrUser()){for(let k=0;k<5;k++)genWeek(addDays(W0,7*k));save();}
 if(USER.role==='admin')loadUsers().then(()=>{if(S.tab==='contrats')safeRender();});
 setInterval(poll,20000);
 setInterval(()=>{if(ymd(new Date())!==TODAY)location.reload();},60000);
}

/* ====== Démarrage ====== */
boot();
</script>
